name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run backend tests
        run: npm test --prefix backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  tracker-build:
    name: Tracker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-tracker/package-lock.json
      - name: Install tracker dependencies
        run: npm ci --prefix project-tracker
      - name: Build tracker
        run: npm run build --prefix project-tracker

  tracker-e2e:
    name: Tracker e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            project-tracker/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install tracker dependencies
        run: npm ci --prefix project-tracker
      - name: Install Playwright browser
        run: npx --prefix project-tracker playwright install --with-deps chromium
      - name: Run tracker e2e tests
        run: npm run test:e2e --prefix project-tracker
